services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Permite que expressões leiam variáveis de ambiente (necessário para OPENWEATHER_API_KEY)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Chave da OpenWeather — defina o valor no seu ambiente, NÃO comite a chave real
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
